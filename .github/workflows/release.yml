name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to release, for example v0.1.0
        required: true
        type: string
      main_run_id:
        description: Successful Main CI run ID for the exact tagged commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-existing-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      MAIN_RUN_ID: ${{ inputs.main_run_id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate tag and Main CI evidence
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not valid SemVer." >&2
            exit 1
          fi
          if [[ ! "$MAIN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Main CI run ID must be numeric." >&2
            exit 1
          fi
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID" --jq .head_sha)"
          run_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID" --jq .name)"
          run_result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID" --jq .conclusion)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$run_name" != "Main CI" || "$run_result" != "success" || "$run_sha" != "$tag_sha" ]]; then
            echo "The selected Main CI run is not a successful build of the tagged commit." >&2
            exit 1
          fi
      - name: Download the attested Main CI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: colorsense-release-*
          path: release
          merge-multiple: true
          run-id: ${{ inputs.main_run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check colorsense-chrome.zip.sha256
      - name: Publish immutable GitHub Release
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
