name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build, package, and verify Chrome extension
        run: pnpm package:chrome
      - name: Assemble immutable release bundle
        run: |
          mkdir -p release
          cp apps/extension/.output/colorsense-0.1.0-chrome.zip release/colorsense-chrome.zip
          sha256sum release/colorsense-chrome.zip > release/colorsense-chrome.zip.sha256
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: apps/extension/.output/chrome-mv3
          format: spdx-json
          output-file: release/colorsense-sbom.spdx.json
      - name: Attest release bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: colorsense-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
