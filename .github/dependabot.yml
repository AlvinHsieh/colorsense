version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type/dependencies
      - risk/medium
      - status/intake
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - github/codeql-action/*
    open-pull-requests-limit: 5
    labels:
      - type/dependencies
      - risk/high
      - status/intake
